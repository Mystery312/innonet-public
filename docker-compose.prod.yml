services:
  # ============================================
  # Databases
  # ============================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: innonet-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - innonet

  redis:
    image: redis:7-alpine
    container_name: innonet-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - innonet

  neo4j:
    image: neo4j:5-community
    container_name: innonet-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - innonet

  # ============================================
  # Application
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: innonet-backend
    env_file:
      - .env.production
    # Make encryption & DB TLS settings explicit at the compose layer. These
    # fall through to .env.production via env_file, but listing them here
    # documents what the backend service requires in production.
    environment:
      ENCRYPTION_KEY_V1: ${ENCRYPTION_KEY_V1:-}
      ENCRYPTION_KEY_V2: ${ENCRYPTION_KEY_V2:-}
      ENCRYPTION_KEY_V3: ${ENCRYPTION_KEY_V3:-}
      ENCRYPTION_CURRENT_VERSION: ${ENCRYPTION_CURRENT_VERSION:-1}
      ENCRYPTION_LOOKUP_HASH_KEY: ${ENCRYPTION_LOOKUP_HASH_KEY:-}
      DB_SSL_MODE: ${DB_SSL_MODE:-require}
      DB_SSL_ROOT_CERT: ${DB_SSL_ROOT_CERT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - innonet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: innonet-frontend
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - innonet

  caddy:
    image: caddy:2-alpine
    container_name: innonet-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - innonet

# ============================================
# Volumes & Networks
# ============================================
volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  caddy_data:
  caddy_config:

networks:
  innonet:
    driver: bridge
