<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />

<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { width:700px; height:200px; margin:0; padding:32px; background:#0A0A0F;

  .v { font: 800 56px/1 "Space Grotesk", sans-serif; color: #4D4DFF; letter-spacing: -.02em;}
  .l { font: 500 13px/1 -apple-system, sans-serif; color: #71717A;}
  .divider { width:1px; height: 60px; background: #25252C; }
  .id { font: 500 13px/1 "JetBrains Mono", monospace; color:#A1A1AA;}
</style>
</head>
<body>
  <div class="stat"><span class="v">500+</span><span class="l">Builders</span></div>
  <div class="divider"></div>
  <div class="stat"><span class="v">50+</span><span class="l">Events</span></div>
  <div class="divider"></div>
  <div class="stat"><span class="v">30+</span><span class="l">Communities</span></div>
  <div class="divider"></div>
  <div class="stat"><span class="id">usr_4D4DFF</span><span class="l">Mono · IDs</span></div>

</html>
