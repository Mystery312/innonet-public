<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { width:700px; height:200px; margin:0; padding:0;
    display:flex; }
  .pane { flex:1; padding: 24px; display:flex; flex-direction:column; gap: 10px; }
  .light { background:#FFFFFF; color: var(--gray-900); }
  .dark { background:#111114; color: #fff; }
  .label { font: 500 11px/1 var(--font-sans); letter-spacing:.08em; text-transform:uppercase; opacity:.6; }
  .surface { padding: 12px 14px; border-radius: var(--radius-md);
    font: 500 13px/1 var(--font-mono, monospace); }
  .light .s1 { background:#FFFFFF; box-shadow: inset 0 0 0 1px #E2E8F0; }
  .light .s2 { background:#F8FAFC; }
  .light .s3 { background:#F1F5F9; }
  .dark .s1 { background:#1A1A1F; }
  .dark .s2 { background:#0A0A0F; }
  .dark .s3 { background:#25252C; }
  .accent { color:#4D4DFF; font-weight:600; }
</style>
</head>
<body>
  <div class="pane light">
    <span class="label">Light theme</span>
    <div class="surface s1">surface · <span class="accent">#4D4DFF</span></div>
    <div class="surface s2">bg-secondary · #F8FAFC</div>
    <div class="surface s3">bg-tertiary · #F1F5F9</div>
  </div>
  <div class="pane dark">
    <span class="label">Dark theme</span>
    <div class="surface s1">surface · <span class="accent">#4D4DFF</span></div>
    <div class="surface s2">bg-secondary · #0A0A0F</div>
    <div class="surface s3">raised · #25252C</div>
  </div>
</body>
</html>
