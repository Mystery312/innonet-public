<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { width:700px; height:240px; margin:0; padding:32px; background:#fff;
    font-family: var(--font-sans); display:flex; gap: 32px; }
  .col { flex:1; display:flex; flex-direction:column; gap: 4px;}
  .label { font: 500 11px/1 var(--font-sans); letter-spacing:.08em; text-transform:uppercase; color:#4D4DFF;}
  .sample { font-size: 36px; line-height: 1.1; color:#0F172A; margin-top: 8px; }
  .name { font: 500 13px/1 var(--font-sans); color: #475569; margin-top: 8px;}
  .meta { font: 400 11px/1 var(--font-mono); color: #94A3B8; }
  .display { font-family: "Space Grotesk", sans-serif; font-weight: 700; letter-spacing:-.02em;}
  .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 500;}
  .mono { font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 28px;}
  .stack { font: 400 10px/1.4 var(--font-mono); color: #94A3B8; margin-top:4px;}
</style>
</head>
<body>
  <div class="col">
    <span class="label">Display</span>
    <div class="sample display">Aa Bb 123</div>
    <span class="name">Space Grotesk</span>
    <span class="stack">400 · 500 · 600 · 700</span>
  </div>
  <div class="col">
    <span class="label">Body</span>
    <div class="sample body">Aa Bb 123</div>
    <span class="name">System sans</span>
    <span class="stack">-apple-system, Segoe UI, Inter…</span>
  </div>
  <div class="col">
    <span class="label">Mono</span>
    <div class="sample mono">Aa 0x1F</div>
    <span class="name">JetBrains Mono</span>
    <span class="stack">stat numbers · IDs · code</span>
  </div>
</body>
</html>
