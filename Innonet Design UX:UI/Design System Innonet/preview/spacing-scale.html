<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { width:700px; height:160px; margin:0; padding:24px; background:#fff;
    font-family: var(--font-sans); display:flex; gap: 24px; align-items:flex-end;}
  .item { display:flex; flex-direction:column; gap: 8px; align-items:center;}
  .box { background: rgba(77,77,255,.12); border: 1px dashed #4D4DFF; }
  .lbl { font: 500 12px/1 var(--font-mono, monospace); color:#475569;}
  .px { font: 400 10px/1 var(--font-mono); color:#94A3B8;}
</style>
</head>
<body>
  <div class="item"><div class="box" style="width:4px;height:4px"></div><span class="lbl">space-1</span><span class="px">4px</span></div>
  <div class="item"><div class="box" style="width:8px;height:8px"></div><span class="lbl">space-2</span><span class="px">8px</span></div>
  <div class="item"><div class="box" style="width:12px;height:12px"></div><span class="lbl">space-3</span><span class="px">12px</span></div>
  <div class="item"><div class="box" style="width:16px;height:16px"></div><span class="lbl">space-4</span><span class="px">16px</span></div>
  <div class="item"><div class="box" style="width:24px;height:24px"></div><span class="lbl">space-6</span><span class="px">24px</span></div>
  <div class="item"><div class="box" style="width:32px;height:32px"></div><span class="lbl">space-8</span><span class="px">32px</span></div>
  <div class="item"><div class="box" style="width:48px;height:48px"></div><span class="lbl">space-12</span><span class="px">48px</span></div>
  <div class="item"><div class="box" style="width:64px;height:64px"></div><span class="lbl">space-16</span><span class="px">64px</span></div>
</body>
</html>
