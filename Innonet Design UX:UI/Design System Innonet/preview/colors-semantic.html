<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { width:700px; height:140px; margin:0; padding:24px; background:#fff;
    font-family: var(--font-sans); display:flex; gap: 12px; }
  .item { flex:1; display:flex; flex-direction:column; gap: 6px; }
  .pill { height: 56px; border-radius: var(--radius-md); display:flex; align-items:center; padding: 0 14px;
    font: 600 13px/1 var(--font-sans); }
  .name { font: 500 12px/1 var(--font-sans); color: var(--color-fg-secondary); }
  .hex { font: 400 11px/1 var(--font-mono, monospace); color: var(--color-fg-muted); }
</style>
</head>
<body>
  <div class="item">
    <div class="pill" style="background:#D1FAE5; color:#10B981">Submitted</div>
    <span class="name">Success</span><span class="hex">#10B981 / #D1FAE5</span>
  </div>
  <div class="item">
    <div class="pill" style="background:#FEF3C7; color:#B45309">Pending</div>
    <span class="name">Warning</span><span class="hex">#F59E0B / #FEF3C7</span>
  </div>
  <div class="item">
    <div class="pill" style="background:#FEE2E2; color:#DC2626">Overdue</div>
    <span class="name">Danger</span><span class="hex">#EF4444 / #FEE2E2</span>
  </div>
  <div class="item">
    <div class="pill" style="background:rgba(6,182,212,.15); color:#0891B2">Info</div>
    <span class="name">Info</span><span class="hex">#06B6D4</span>
  </div>
</body>
</html>
