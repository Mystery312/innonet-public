<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { width:700px; height:140px; margin:0; padding:24px; background:#fff;
    font-family: var(--font-sans); display:flex; gap: 10px; flex-wrap:wrap; align-content:center;}
  .badge { display:inline-flex; align-items:center; gap:6px; font-weight:500;
    font-size: .8125rem; padding: .25rem .75rem; border-radius: 9999px;}
  .primary { background: rgba(77,77,255,.15); color:#4D4DFF;}
  .success { background:#D1FAE5; color:#047857;}
  .warning { background:#FEF3C7; color:#B45309;}
  .danger { background:#FEE2E2; color:#DC2626;}
  .info { background: rgba(6,182,212,.15); color:#0891B2;}
  .neutral { background:#F1F5F9; color:#475569;}
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor;}
</style>
</head>
<body>
  <span class="badge primary"><span class="dot"></span>92% match</span>
  <span class="badge success"><span class="dot"></span>Submitted</span>
  <span class="badge warning"><span class="dot"></span>Pending</span>
  <span class="badge danger"><span class="dot"></span>Overdue</span>
  <span class="badge info"><span class="dot"></span>New</span>
  <span class="badge neutral">Draft</span>
  <span class="badge primary">AI · Recommended</span>
  <span class="badge neutral">React</span>
  <span class="badge neutral">AI/ML</span>
  <span class="badge neutral">Design</span>
  <span class="badge primary">Hackathon</span>
  <span class="badge success">Live now</span>
</body>
</html>
