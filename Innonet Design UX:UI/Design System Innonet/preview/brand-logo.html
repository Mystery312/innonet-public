<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { width:700px; height:200px; margin:0; padding:0;
    background: var(--ink-1000); display:flex; align-items:center; justify-content:center; }
  .wrap { display:flex; align-items:center; gap: 28px; }
  .mark { width: 380px; height: 80px; }
  .meta { display:flex; flex-direction:column; gap: 6px; }
  .meta .l { font: 500 12px/1 var(--font-sans); letter-spacing: .08em;
             text-transform: uppercase; color: var(--blue-400); }
  .meta .v { font: 700 22px/1.2 "Space Grotesk", sans-serif; color: #fff; letter-spacing: -.01em; }
  .meta .h { font: 500 13px/1 var(--font-mono, monospace); color: var(--gray-400); }
</style>
</head>
<body>
  <div class="wrap">
    <img src="../assets/logo.svg" class="mark" alt="InnoNet" />
    <div class="meta">
      <span class="l">Primary mark</span>
      <span class="v">InnoNet</span>
      <span class="h">#4D4DFF · electric blue</span>
    </div>
  </div>
</body>
</html>
